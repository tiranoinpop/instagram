<!DOCTYPE html>
<!-- 스타일의 중첩 -->
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <title>스타일의 중첩</title>
        <style>
            p {
                border:solid;
                border-color: blue;
            }
            #myid {
                color:red;
            }
            .myClass {
                color:green;
                border-color: violet;
            }
        </style>
    </head>
    <body>
        <p class="myClass" id="myid">
            어떤 결과가 나올까요?
        </p>
    </body>
</html>
