<!-- 주석은 ctrl + / 키 -->
<!-- css 와 html 연결은 head 안에서 link tag, href 로 지정 rel 은 relation 관계가 뭔지 표지 -->
<!-- 1. html 은 자체적으로 정보를 포함 -->
<!-- 2. image 폴더로부터 정보를 불러올 수 있음 -->
<!-- 3. 정보를 어떤 구조로 표현할지에 대한 것도 포함 -->
<!-- 4. 외부의 스타일 css 문서를 불러올 수 있다. -->
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>인스타그램 프로필</title>
        <link href="./css/style.css" rel="stylesheet">
        <style>
            /* 필요하다면 style 태그는 head 안에 작성 */
        </style>
    </head>
    <body>
        <!-- header : 페이지 상단 영역 (로고, 검색창) -->
        <header id="top">
            <img src="./image/instagram_logo.png" alt="인스타그램 로고"/>
            <input type="search" value="검색"/>
            <div></div>
        </header>

        <!-- main : 페이지의 핵심 내용 (페이지당 하나) -->
        <main>
        <!-- section : 주제별 구역 (프로필 / 소개 / 하이라이트 / 통계 / 게시물) -->
        <section id="profile">
            <div id="profile_pic">
                <img class="circle_pic" src="./image/profile2.jpg" alt="프로필 사진"/>
            </div>
            <div id="profile_info">
                <div id="id">tiranoinpop</div>
                <button>프로필편집</button>    
            </div>
        </section>

        <section id="bio">
            <p>
                <strong>
                김인수(Kim insu)
                </strong><br/>
                프로그래머
            </p>
            <p>
                <a href="https://github.com/tiranoinpop/instagram">
                    github.com/tiranoinpop/instagram
                </a>
            </p>
        </section>

        <section id="highlight_area">
            <div class="highlight">
                <div class="highlight_pic">
                    <img src="./image/istockphoto-1325997570-612x612.jpg" class="circle_pic" alt="하이라이트 1">    
                </div>
                <div>
                    ❤️
                </div>
            </div>
            <div class="highlight">
                <div class="highlight_pic">
                    <img src="./image/istockphoto-1443562748-612x612.jpg" class="circle_pic" alt="하이라이트 2">    
                </div>
                <div>
                    😊
                </div>
            </div>
            <div></div>
        </section>

        <section id="stat_bar">
            <div class="stat">
                게시물<br />
                133
            </div>
            <div class="stat">
                팔로워<br />
                408
            </div>
            <div class="stat">
                팔로우<br />
                408
            </div>
        </section>

        <!-- nav : 이동 메뉴 (게시물 / 태그됨 같은 탭 아이콘이 들어갈 자리) -->
        <nav>아이콘이 들어갈 자리</nav>

        <section id="posts">
        <div class="thumbnail_grid">
            <img src="image/thumbnails/2025_09_22_22_31_51.jpg" class="thumbnail" alt="게시물 썸네일"/>
            <img src="image/thumbnails/2025_09_23_00_17_30.jpg" class="thumbnail" alt="게시물 썸네일"/>
            <img src="image/thumbnails/2025_09_23_21_58_48.jpg" class="thumbnail" alt="게시물 썸네일"/>
        </div>

        <div class="thumbnail_grid">
            <img src="image/thumbnails/2025_09_27_12_34_33.jpg" class="thumbnail" alt="게시물 썸네일"/>
            <img src="image/thumbnails/2025_09_28_01_31_12.jpg" class="thumbnail" alt="게시물 썸네일"/>
            <img src="image/thumbnails/2025_09_28_10_06_58.jpg" class="thumbnail" alt="게시물 썸네일"/>
        </div>

        <div class="thumbnail_grid">
            <img src="image/thumbnails/2025_09_3_23_15_59.jpg" class="thumbnail" alt="게시물 썸네일"/>
            <img src="image/thumbnails/2025_09_3_23_30_40.jpg" class="thumbnail" alt="게시물 썸네일"/>
            <img src="image/thumbnails/2025_10_10_13_38_37.jpg" class="thumbnail" alt="게시물 썸네일"/>
        </div>
        </section>
        </main>

        <!-- footer : 페이지 하단 영역 -->
        <footer>

        </footer>
    </body>
</html>
